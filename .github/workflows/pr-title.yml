name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  conventional-commits:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # The title becomes the squashed commit on main.
      # It is never printed: a title could hold a workflow command.
      - name: Check the title follows Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if printf '%s\n' "$TITLE" | grep -Eq '^(feat|fix|docs|test|refactor|ci|chore)(\([a-z0-9-]+\))?!?: [^ ]'; then
            exit 0
          fi
          echo "::error::The pull request title must follow Conventional Commits, for example 'feat: add file search'. Allowed types: feat, fix, docs, test, refactor, ci, chore."
          exit 1
